services:
  - type: web
    name: ebook-api-node
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_AUTH_TOKEN
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: 100
      - key: OUTPUT_TTL_MS
        value: 3600000
      - key: CALIBRE_BIN
        value: /usr/bin/ebook-convert
      - key: CALIBRE_DEBUG_BIN
        value: /usr/bin/calibre-debug
      - key: ENABLE_SELF_PING
        value: false
